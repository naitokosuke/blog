name: Deploy

# Vercel's own build image (Amazon Linux 2023) ships glibc 2.34, below the
# glibc 2.36 floor Vize's native binary is built for, so the site is built
# here on Ubuntu with the same compiler as development and handed to Vercel
# already built. Vercel's Git builds are turned off in vercel.json.

on:
  push:
    branches:
      - main
  pull_request:

# A newer push supersedes a deploy of the same ref still in flight
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # To keep one comment on the PR pointing at its latest preview
  pull-requests: write

env:
  # Not secrets: they only say which project the token deploys to
  VERCEL_ORG_ID: team_HFMuJudW4hF6OkJGIbPycXRU
  VERCEL_PROJECT_ID: prj_YiVuKVlDNtsaJemBbUcI0bGeg4ZJ
  VERCEL_CLI: vercel@65.2.0

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      ENVIRONMENT: ${{ github.event_name == 'push' && 'production' || 'preview' }}
      PROD_FLAG: ${{ github.event_name == 'push' && '--prod' || '' }}
    steps:
      - uses: actions/checkout@v4.4.0

      # vercel build runs the project's install, which needs pnpm on the PATH
      - uses: pnpm/action-setup@v4.3.0

      - uses: actions/setup-node@v4.4.0
        with:
          node-version-file: .nvmrc

      - name: Pull the project settings and environment variables
        run: npx --yes "$VERCEL_CLI" pull --yes --environment="$ENVIRONMENT" --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: npx --yes "$VERCEL_CLI" build $PROD_FLAG --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # Off Vercel, Nitro cannot tell it is building for Vercel and writes
          # a Node server to .output; name the preset so it emits the Build
          # Output API layout (.vercel/output) that --prebuilt uploads
          NITRO_PRESET: vercel

      - name: Deploy
        run: |
          url=$(npx --yes "$VERCEL_CLI" deploy --prebuilt $PROD_FLAG --token="$VERCEL_TOKEN")
          echo "Deployed to $url ($ENVIRONMENT)" >> "$GITHUB_STEP_SUMMARY"
          echo "url=$url" >> "$GITHUB_OUTPUT"
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # Every deploy gets a new URL, so the PR's comment is rewritten each
      # time rather than a new one added
      - name: Point the PR at its preview
        if: github.event_name == 'pull_request'
        run: |
          gh pr comment "$PR" --edit-last --create-if-none \
            --body "Preview of $SHA: $URL"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          URL: ${{ steps.deploy.outputs.url }}
