name: Secretlint

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  secretlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0

      # vp ships as a devDependency, so the first install still comes from
      # pnpm. Everything after it runs through vp.
      - uses: pnpm/action-setup@v4.3.0

      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 26

      - name: Install dependencies
        run: pnpm install

      - name: Run secretlint
        run: node_modules/.bin/vp run secretlint
