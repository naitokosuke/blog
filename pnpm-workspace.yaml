minimumReleaseAge: 1440

# Vize publishes several releases a day, so a one-day hold makes every fix
# untestable until it is already superseded. oxlint-plugin-vize ships in the
# same release train and comes in through vize itself.
minimumReleaseAgeExclude:
  - "@vizejs/*"
  - "vize"
  - "oxlint-plugin-vize"

overrides:
  chokidar: "^3.6.0"

publicHoistPattern:
  - "@shikijs/*"

allowBuilds:
  "@parcel/watcher": true
  better-sqlite3: true
  esbuild: true
  lefthook: true
  sharp: true
  unrs-resolver: true
  vue-demi: false
