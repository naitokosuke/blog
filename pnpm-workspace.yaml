# 公開から 24 時間 (1440 分) 経過していないバージョンは解決しない (サプライチェーン対策)
minimumReleaseAge: 1440

overrides:
  chokidar: "^3.6.0"

# pnpm 11 で onlyBuiltDependencies から allowBuilds (マップ) へ移行
allowBuilds:
  "@parcel/watcher": true
  better-sqlite3: true
  esbuild: true
  lefthook: true
  sharp: true
  unrs-resolver: true
